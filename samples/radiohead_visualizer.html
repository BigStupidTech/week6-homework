<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Timestamp Visualizer</title>
<style>
  :root{
    --bg:#0f1220; --panel:#171a2b; --panel2:#1e2238; --line:#2a2f4a;
    --text:#e8eaf6; --muted:#9aa0c3; --accent:#7c5cff; --lit:#ffd36b; --active:#2b2f52;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  header h1{font-size:18px;margin:0;font-weight:650}
  header .tag{color:var(--muted);font-size:12.5px}
  .search{margin-left:auto;display:flex;gap:8px}
  input,button{font:inherit}
  input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 12px;min-width:220px}
  button{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600}
  button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}
  main{display:grid;grid-template-columns:330px 1fr;gap:0;height:calc(100vh - 63px)}
  @media(max-width:760px){main{grid-template-columns:1fr;height:auto}}
  .list{border-right:1px solid var(--line);overflow:auto;padding:10px}
  .list .hint{color:var(--muted);padding:14px;font-size:13.5px}
  .trk{padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin:8px 0;cursor:pointer;background:var(--panel)}
  .trk:hover{border-color:var(--accent)}
  .trk.sel{border-color:var(--accent);background:var(--panel2)}
  .trk .t{font-weight:600}
  .trk .m{color:var(--muted);font-size:12.5px;margin-top:2px}
  .trk .no{color:#ff7b7b}
  .player{display:flex;flex-direction:column;min-width:0}
  .controls{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .controls .now{font-variant-numeric:tabular-nums;color:var(--muted);min-width:96px}
  input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
  .spd{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
  .lyrics{overflow:auto;padding:28px 22px 60vh;scroll-behavior:smooth}
  .ln{font-size:22px;line-height:1.7;color:var(--muted);opacity:.55;margin:2px 0;transition:opacity .2s,color .2s;cursor:pointer}
  .ln.past{opacity:.8;color:var(--text)}
  .ln.active{opacity:1;color:var(--text);background:var(--active);border-radius:10px;padding:4px 10px;margin:4px -10px}
  .ln.blank{font-size:16px}
  .ln .w{transition:color .08s}
  .ln.active .w.lit,.ln.past .w{color:var(--lit)}
  .empty{color:var(--muted);padding:40px 22px;font-size:16px}
  footer{color:var(--muted);font-size:12px;padding:8px 18px;border-top:1px solid var(--line)}
  a{color:var(--accent)}
</style>
</head>

<header>

    <button id="go">Search</button>
  </div>
</header>
<main>
  <div class="list" id="list"><div class="hint">Search LRCLIB above, then click a track to watch its lyrics light up.</div></div>
  <div class="player">
    <div class="controls">

      <span class="spd">speed

    </div>
    <div class="lyrics" id="lyrics"><div class="empty">No track selected yet.</div></div>
  </div>
</main>
<footer>Data: <a href="https://lrclib.net" target="_blank" rel="noopener">LRCLIB</a> (free, CORS-open). Part of the <b>music-timestamp-coverage</b> skill.</footer>

    ln.end = idx+1 < cur.lines.length ? cur.lines[idx+1].t : dur;
    const div = document.createElement("div");
    div.className = "ln" + (ln.text ? "" : " blank");
    div.onclick = ()=>{ seek(ln.t); if(!playing) play(); };
    if(ln.text){
      ln.words = ln.text.split(/(\s+)/);  // keep whitespace tokens
      ln.words.forEach(w=>{
        if(/^\s+$/.test(w)){ div.appendChild(document.createTextNode(w)); }
        else { const s=document.createElement("span"); s.className="w"; s.textContent=w; div.appendChild(s); }
      });
    } else { div.textContent = "···"; ln.words = []; }
    ln.el = div; ly.appendChild(div);
  });
  $("#dur").textContent = fmt(dur);
  $("#seek").max = dur; $("#seek").disabled = false;
  $("#play").disabled = false; $("#restart").disabled = false;
  seek(0); pause();
}

function disableControls(){ $("#play").disabled=$("#restart").disabled=$("#seek").disabled=true; }

function updateHighlight(){
  if(!cur) return;
  let active = -1;
  for(let i=0;i<cur.lines.length;i++){ if(cur.lines[i].t <= t) active = i; else break; }
  cur.lines.forEach((ln,i)=>{
    const el = ln.el;
    el.classList.toggle("active", i===active);
    el.classList.toggle("past", i<active);
    if(i===active && ln.words && ln.words.length){
      const span = Math.max(0.01, ln.end - ln.t);
      const frac = Math.min(1, Math.max(0,(t - ln.t)/span));
      const realWords = ln.el.querySelectorAll(".w");
      const lit = Math.round(frac * realWords.length);
      realWords.forEach((w,wi)=> w.classList.toggle("lit", wi < lit));
    } else if(i!==active){
      ln.el.querySelectorAll(".w.lit").forEach(w=>w.classList.remove("lit"));
    }
  });
  if(active>=0) cur.lines[active].el.scrollIntoView({block:"center", behavior:"smooth"});
  $("#cur").textContent = fmt(t);
  $("#seek").value = t;
}

function tick(now){
  if(playing){
    if(!lastTs) lastTs = now;
    t += (now - lastTs)/1000 * speed; lastTs = now;
    if(t >= dur){ t = dur; updateHighlight(); pause(); return; }
    updateHighlight();
    raf = requestAnimationFrame(tick);
  }
}
function play(){ if(!cur) return; playing = true; lastTs = 0; $("#play").textContent="❚❚ Pause"; raf = requestAnimationFrame(tick); }
function pause(){ playing = false; if(raf) cancelAnimationFrame(raf); raf=null; $("#play").textContent="▶ Play"; }
function seek(x){ t = Math.min(dur, Math.max(0, x)); lastTs = 0; updateHighlight(); }

$("#play").onclick = ()=> playing ? pause() : play();
$("#restart").onclick = ()=>{ seek(0); };
$("#seek").oninput = e => { seek(+e.target.value); };
$("#speed").onchange = e => { speed = +e.target.value; };

async function search(q){
  q = (q||"").trim(); if(!q) return;
  $("#list").innerHTML = '<div class="hint">Searching LRCLIB…</div>';
  try{
    const r = await fetch(`${API}/search?q=${encodeURIComponent(q)}`);
    tracks = r.ok ? await r.json() : [];
  }catch(e){ $("#list").innerHTML = '<div class="hint">Network error reaching LRCLIB. Open this file in a normal browser (not an offline sandbox) and check your connection.</div>'; return; }
  sel = null; renderList();
}
$("#go").onclick = ()=> search($("#q").value);
$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter") search($("#q").value); });

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// init
if(Array.isArray(EMBEDDED)){ tracks = EMBEDDED; renderList(); document.querySelector("header .tag").textContent = "Pre-loaded tracks · no audio — a timer lights up words by their timestamps"; }
</script>
</body>
</html>
